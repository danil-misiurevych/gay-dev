<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070912">
  <meta name="description" content="A space bar: slice ingredients, fill orders. Mechanics prototype.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Slice Lab</title>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="fx"></canvas>
  </div>

  <div id="hud" data-ui>
    <div class="readouts">
      <div class="stat score"><span class="k">Score</span><span class="v" id="v-score">0</span></div>
      <div class="stat combo"><span class="k">Combo</span><span class="v" id="v-combo">×0</span></div>
      <div class="stat miss" id="s-miss"><span class="k">Missed</span><span class="v" id="v-miss">0</span></div>
      <div class="stat fps"><span class="k">FPS</span><span class="v" id="v-fps">–</span></div>
    </div>
    <div class="tools">
      <button type="button" id="btn-pause" aria-pressed="false">Pause</button>
      <button type="button" id="btn-hit" aria-pressed="false">Hitboxes</button>
      <button type="button" id="btn-panel">Tuning</button>
    </div>
  </div>

  <aside id="panel" data-ui aria-label="Mechanics tuning">
    <div class="p-head">
      <h2>Tuning</h2>
      <button type="button" id="btn-close">Close</button>
    </div>
    <div class="p-body" id="panel-body"></div>
  </aside>

  <div id="recipe" data-ui aria-live="polite" aria-label="Current recipe"></div>

  <div id="intro"><p>Drag your finger or mouse through a flying object</p></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
